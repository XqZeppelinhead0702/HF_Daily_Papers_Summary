timezone: Asia/Shanghai
database: data/digest.sqlite3

interests:
  - name: Open-vocabulary segmentation
    description: Focus on how models recognize categories absent during training and how the authors evaluate generalization.
    keywords: [open-vocabulary segmentation, zero-shot segmentation, unseen classes]
  - name: Multimodal vision
    description: Focus on vision-language models for visual grounding, image understanding, and visual reasoning.
    keywords: [vision-language model, visual grounding, multimodal reasoning]

max_candidates: 60
screen_batch_size: 1
min_score: 65
max_papers_per_day: 5

screening_prompt: |
  Prioritize papers that make a clear methodological contribution backed by experiments.
  Score a topic as weakly related if it appears only in related work. Accept relevant papers that use synonyms or omit the exact keywords.

explanation_prompt: |
  Write for graduate students with a background in deep learning.
  Introduce the problem and the intuition behind the method, then explain its inputs, main components, and outputs.
  Discuss the experiments that best support the conclusions, including datasets, metrics, comparison conditions, and results.
  End with one question for a research group discussion.

llm:
  json_mode: true
  timeout_seconds: 90

papers:
  allow_pdf_fallback: true
  save_pdf: false
  pdf_dir: papers
  max_source_chars: 36000

report:
  language: en
  html: true
  markdown: false
  output_dir: reports
