[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hf-daily-papers-summary"
version = "0.1.0"
description = "Personal Hugging Face Daily Papers digest"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "httpx>=0.27,<1",
    "Jinja2>=3.1.6,<4",
    "latex2mathml>=3.81.1,<4",
    "pydantic>=2.7,<3",
    "pypdf>=5,<8",
    "python-dotenv>=1,<2",
    "PyYAML>=6,<7",
    "tzdata>=2024.1; platform_system == 'Windows'",
]

[project.scripts]
paper-digest = "paper_digest.__main__:main"

[tool.setuptools.packages.find]
include = ["paper_digest*"]

[tool.setuptools.package-data]
paper_digest = ["templates/*.html", "templates/*.css"]
